name: Pull Request Checks

on:
  pull_request:
    branches:
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-check:
    name: Build and Checks (esp32 + esp32s3 + esp32c3)
    runs-on: ubuntu-latest
    container: espressif/idf:v6.0
    env:
      IDF_PATH: /opt/esp/idf

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Test Harness Sanity
        run: |
          python3 -m py_compile tools/test_integration.py
          python3 -m py_compile tools/test_shell_host_integration.py
          python3 -m py_compile tools/test_build_health.py
          python3 tools/test_shell_host_integration.py

      - name: Build Firmware (esp32)
        shell: bash
        run: |
          source "$IDF_PATH/export.sh"
          idf.py fullclean
          idf.py set-target esp32
          idf.py build

      - name: Validate Build Health (esp32)
        shell: bash
        run: |
          source "$IDF_PATH/export.sh"
          python3 tools/test_build_health.py --target esp32

      - name: Package Artifacts (esp32)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/esp32
          cp build/esp32os.bin dist/esp32/esp32os-esp32.bin
          cp build/esp32os.elf dist/esp32/esp32os-esp32.elf
          cp build/bootloader/bootloader.bin dist/esp32/bootloader-esp32.bin
          cp build/partition_table/partition-table.bin dist/esp32/partition-table-esp32.bin
          cp sdkconfig dist/esp32/sdkconfig-esp32
          if [ -f build/esp32os.map ]; then cp build/esp32os.map dist/esp32/esp32os-esp32.map; fi
          if [ -f build/flasher_args.json ]; then cp build/flasher_args.json dist/esp32/flasher_args-esp32.json; fi

      - name: Build Firmware (esp32s3)
        shell: bash
        run: |
          source "$IDF_PATH/export.sh"
          idf.py fullclean
          idf.py set-target esp32s3
          idf.py build

      - name: Validate Build Health (esp32s3)
        shell: bash
        run: |
          source "$IDF_PATH/export.sh"
          python3 tools/test_build_health.py --target esp32s3

      - name: Package Artifacts (esp32s3)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/esp32s3
          cp build/esp32os.bin dist/esp32s3/esp32os-esp32s3.bin
          cp build/esp32os.elf dist/esp32s3/esp32os-esp32s3.elf
          cp build/bootloader/bootloader.bin dist/esp32s3/bootloader-esp32s3.bin
          cp build/partition_table/partition-table.bin dist/esp32s3/partition-table-esp32s3.bin
          cp sdkconfig dist/esp32s3/sdkconfig-esp32s3
          if [ -f build/esp32os.map ]; then cp build/esp32os.map dist/esp32s3/esp32os-esp32s3.map; fi
          if [ -f build/flasher_args.json ]; then cp build/flasher_args.json dist/esp32s3/flasher_args-esp32s3.json; fi

      - name: Build Firmware (esp32c3)
        shell: bash
        run: |
          source "$IDF_PATH/export.sh"
          idf.py fullclean
          idf.py set-target esp32c3
          idf.py build

      - name: Validate Build Health (esp32c3)
        shell: bash
        run: |
          source "$IDF_PATH/export.sh"
          python3 tools/test_build_health.py --target esp32c3

      - name: Package Artifacts (esp32c3)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/esp32c3
          cp build/esp32os.bin dist/esp32c3/esp32os-esp32c3.bin
          cp build/esp32os.elf dist/esp32c3/esp32os-esp32c3.elf
          cp build/bootloader/bootloader.bin dist/esp32c3/bootloader-esp32c3.bin
          cp build/partition_table/partition-table.bin dist/esp32c3/partition-table-esp32c3.bin
          cp sdkconfig dist/esp32c3/sdkconfig-esp32c3
          if [ -f build/esp32os.map ]; then cp build/esp32os.map dist/esp32c3/esp32os-esp32c3.map; fi
          if [ -f build/flasher_args.json ]; then cp build/flasher_args.json dist/esp32c3/flasher_args-esp32c3.json; fi
      - name: Write artifact provenance manifest
        shell: bash
        run: |
          set -euo pipefail
          # Git commands run inside the ESP-IDF container, whose UID can differ
          # from the host runner that created the checkout. Trust only this workspace.
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

          SOURCE_COMMIT="$(git rev-parse HEAD)"
          SOURCE_TREE="$(git rev-parse 'HEAD^{tree}')"
          test -n "$SOURCE_COMMIT"
          test -n "$SOURCE_TREE"

          mkdir -p dist
          cat > dist/manifest.json <<EOF
          {
            "source_commit_sha": "$SOURCE_COMMIT",
            "source_tree_sha": "$SOURCE_TREE",
            "pull_request_number": "${{ github.event.pull_request.number }}",
            "workflow_run_id": "${{ github.run_id }}"
          }
          EOF

          # Fail the PR build instead of publishing an artifact that can never
          # pass the release workflow's provenance verification.
          jq -e '
            (.source_commit_sha | type == "string" and length == 40) and
            (.source_tree_sha | type == "string" and length == 40) and
            (.pull_request_number | length > 0) and
            (.workflow_run_id | length > 0)
          ' dist/manifest.json
      - name: Upload PR Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pr-build-artifacts
          path: |
            dist/esp32/
            dist/esp32s3/
            dist/esp32c3/
            dist/manifest.json
          if-no-files-found: error
