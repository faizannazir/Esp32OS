name: Master CI Build Test Release

on:
  push:
    branches:
      - master

permissions:
  actions: read
  contents: write
  pull-requests: read

jobs:
  build-test:
    name: Build and Test (esp32 + esp32s3 + esp32c3)
    runs-on: ubuntu-latest
    container: espressif/idf:v6.0
    env:
      IDF_PATH: /opt/esp/idf

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reuse verified pull-request firmware artifacts
        id: reuse
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p dist
          echo "reused=false" >> "$GITHUB_OUTPUT"
          PR_INFO="$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" --jq '.[0] | [.number, .head.sha] | @tsv' 2>/dev/null || true)"
          if [ -z "$PR_INFO" ]; then
            echo "No merged pull request found for this push; a source build will run."
            exit 0
          fi
          read -r PR_NUMBER PR_HEAD_SHA <<< "$PR_INFO"
          echo "Checking successful PR artifacts for PR #$PR_NUMBER ($PR_HEAD_SHA)"
          RUNS_JSON="$(gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/workflows/pr-checks.yml/runs?event=pull_request&status=success&per_page=100")"
          RUN_ID="$(printf '%s' "$RUNS_JSON" | jq -r --arg pr "$PR_NUMBER" --arg head "$PR_HEAD_SHA" '[.[] | .workflow_runs[]? | select(any(.pull_requests[]?; ((.number|tostring)==$pr) and .head.sha==$head))] | sort_by(.run_started_at) | last | .id // empty')"
          if [ -z "$RUN_ID" ]; then
            echo "No successful matching PR run found; a source build will run."
            exit 0
          fi
          rm -rf dist && mkdir -p dist
          if ! gh run download "$RUN_ID" --name pr-build-artifacts --dir dist; then
            echo "PR artifact download failed; falling back to a source build."
            rm -rf dist && mkdir -p dist
            exit 0
          fi
          EXPECTED_TREE="$(git rev-parse HEAD^{tree})"
          ARTIFACT_TREE="$(jq -r '.source_tree_sha // empty' dist/manifest.json 2>/dev/null || true)"
          if [ -z "$ARTIFACT_TREE" ] || [ "$ARTIFACT_TREE" != "$EXPECTED_TREE" ]; then
            echo "Artifact source tree does not match the merged tree; falling back to a source build."
            rm -rf dist && mkdir -p dist
            exit 0
          fi
          for target in esp32 esp32s3 esp32c3; do
            for artifact in "esp32os-$target.bin" "esp32os-$target.elf" "bootloader-$target.bin" "partition-table-$target.bin" "sdkconfig-$target"; do
              if [ ! -s "dist/$target/$artifact" ]; then
                echo "Missing $target artifact: $artifact"
                rm -rf dist && mkdir -p dist
                exit 0
              fi
            done
          done
          echo "Verified PR artifacts match the exact merged source tree. Skipping firmware rebuild."
          echo "reused=true" >> "$GITHUB_OUTPUT"

      - name: Host Test Harness Checks
        run: |
          python3 -m py_compile tools/test_integration.py
          python3 -m py_compile tools/test_shell_host_integration.py
          python3 -m py_compile tools/test_build_health.py
          python3 tools/test_shell_host_integration.py

      - name: Build Firmware (esp32)
        if: steps.reuse.outputs.reused != 'true'
        shell: bash
        run: |
          source "$IDF_PATH/export.sh"
          idf.py fullclean
          idf.py set-target esp32
          idf.py build

      - name: Validate Build Health (esp32)
        if: steps.reuse.outputs.reused != 'true'
        shell: bash
        run: |
          source "$IDF_PATH/export.sh"
          python3 tools/test_build_health.py --target esp32

      - name: Package Output Files (esp32)
        if: steps.reuse.outputs.reused != 'true'
        shell: bash
        run: |
          set -euo pipefail
          out_dir="dist/esp32"
          mkdir -p "$out_dir"

          cp build/esp32os.bin "$out_dir/esp32os-esp32.bin"
          cp build/esp32os.elf "$out_dir/esp32os-esp32.elf"
          cp build/bootloader/bootloader.bin "$out_dir/bootloader-esp32.bin"
          cp build/partition_table/partition-table.bin "$out_dir/partition-table-esp32.bin"

          if [ -f build/esp32os.map ]; then
            cp build/esp32os.map "$out_dir/esp32os-esp32.map"
          fi

          if [ -f build/flasher_args.json ]; then
            cp build/flasher_args.json "$out_dir/flasher_args-esp32.json"
          fi

          cp sdkconfig "$out_dir/sdkconfig-esp32"

          (
            cd "$out_dir"
            zip -9 "esp32os-esp32-artifacts.zip" ./*
          )

      - name: Build Firmware (esp32s3)
        if: steps.reuse.outputs.reused != 'true'
        shell: bash
        run: |
          source "$IDF_PATH/export.sh"
          idf.py fullclean
          idf.py set-target esp32s3
          idf.py build

      - name: Validate Build Health (esp32s3)
        if: steps.reuse.outputs.reused != 'true'
        shell: bash
        run: |
          source "$IDF_PATH/export.sh"
          python3 tools/test_build_health.py --target esp32s3

      - name: Package Output Files (esp32s3)
        if: steps.reuse.outputs.reused != 'true'
        shell: bash
        run: |
          set -euo pipefail
          out_dir="dist/esp32s3"
          mkdir -p "$out_dir"

          cp build/esp32os.bin "$out_dir/esp32os-esp32s3.bin"
          cp build/esp32os.elf "$out_dir/esp32os-esp32s3.elf"
          cp build/bootloader/bootloader.bin "$out_dir/bootloader-esp32s3.bin"
          cp build/partition_table/partition-table.bin "$out_dir/partition-table-esp32s3.bin"

          if [ -f build/esp32os.map ]; then
            cp build/esp32os.map "$out_dir/esp32os-esp32s3.map"
          fi

          if [ -f build/flasher_args.json ]; then
            cp build/flasher_args.json "$out_dir/flasher_args-esp32s3.json"
          fi

          cp sdkconfig "$out_dir/sdkconfig-esp32s3"

          (
            cd "$out_dir"
            zip -9 "esp32os-esp32s3-artifacts.zip" ./*
          )

      - name: Build Firmware (esp32c3)
        if: steps.reuse.outputs.reused != 'true'
        shell: bash
        run: |
          source "$IDF_PATH/export.sh"
          idf.py fullclean
          idf.py set-target esp32c3
          idf.py build

      - name: Validate Build Health (esp32c3)
        if: steps.reuse.outputs.reused != 'true'
        shell: bash
        run: |
          source "$IDF_PATH/export.sh"
          python3 tools/test_build_health.py --target esp32c3

      - name: Package Output Files (esp32c3)
        if: steps.reuse.outputs.reused != 'true'
        shell: bash
        run: |
          set -euo pipefail
          out_dir="dist/esp32c3"
          mkdir -p "$out_dir"
          cp build/esp32os.bin "$out_dir/esp32os-esp32c3.bin"
          cp build/esp32os.elf "$out_dir/esp32os-esp32c3.elf"
          cp build/bootloader/bootloader.bin "$out_dir/bootloader-esp32c3.bin"
          cp build/partition_table/partition-table.bin "$out_dir/partition-table-esp32c3.bin"
          if [ -f build/esp32os.map ]; then cp build/esp32os.map "$out_dir/esp32os-esp32c3.map"; fi
          if [ -f build/flasher_args.json ]; then cp build/flasher_args.json "$out_dir/flasher_args-esp32c3.json"; fi
          cp sdkconfig "$out_dir/sdkconfig-esp32c3"
          ( cd "$out_dir" && zip -9 esp32os-esp32c3-artifacts.zip ./* )
      - name: Ensure per-target artifact archives
        shell: bash
        run: |
          set -euo pipefail
          for target in esp32 esp32s3 esp32c3; do
            archive="dist/$target/esp32os-$target-artifacts.zip"
            if [ ! -s "$archive" ]; then
              ( cd "dist/$target" && zip -9 "esp32os-$target-artifacts.zip" ./* )
            fi
          done
      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: esp32os-build-artifacts
          path: |
            dist/esp32/
            dist/esp32s3/
            dist/esp32c3/
          if-no-files-found: error

  tag-release:
    name: Create Tag and Release
    runs-on: ubuntu-latest
    needs: [build-test]

    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Create Combined Release Zip
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-bundle
          cp -R release-artifacts/* release-bundle/
          (
            cd release-bundle
            zip -r -9 ../esp32os-all-targets-artifacts.zip .
          )

      - name: Generate Auto Tag
        id: meta
        shell: bash
        run: |
          echo "tag=v$(date -u +'%Y.%m.%d')-r${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ESP32OS Automated Release ${{ steps.meta.outputs.tag }}
          generate_release_notes: true
          files: |
            release-artifacts/**/*.bin
            release-artifacts/**/*.elf
            release-artifacts/**/*.map
            release-artifacts/**/*.json
            release-artifacts/**/*.zip
            release-artifacts/**/sdkconfig-*
            esp32os-all-targets-artifacts.zip
