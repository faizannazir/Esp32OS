<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="690" viewBox="0 0 1200 690" role="img" aria-labelledby="title desc">
  <title id="title">ESP32OS responsibility map</title>
  <desc id="desc">Application code, the UART shell and optional remote interfaces use ESP32OS runtime, storage, networking and hardware services. These services build on ESP-IDF and FreeRTOS running on ESP32, S3 or C3 hardware. Groups show responsibilities, not strict dependency isolation.</desc>
  <rect width="1200" height="690" rx="22" fill="#0e1a28"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="44" y="47" fill="#81ddc6" font-size="12" font-weight="700" letter-spacing="2">INSIDE THE FIRMWARE</text>
    <text x="44" y="89" fill="#eef2ef" font-size="32" font-weight="700" letter-spacing="-.7">One application. Composable services.</text>
    <text x="44" y="118" fill="#9eb4c5" font-size="16">FreeRTOS schedules the tasks; ESP32OS makes the system accessible.</text>
    <rect x="44" y="150" width="1112" height="104" rx="12" fill="#172a3c" stroke="#355069"/>
    <text x="66" y="178" fill="#88a6bb" font-size="11" letter-spacing="1.5">INTERFACES + APPLICATION CODE</text>
    <text x="66" y="214" fill="#edf3f2" font-size="21" font-weight="700">Your C components</text>
    <text x="390" y="214" fill="#edf3f2" font-size="21" font-weight="700">UART shell</text>
    <text x="690" y="214" fill="#edf3f2" font-size="21" font-weight="700">Browser + Telnet</text>
    <text x="690" y="237" fill="#9eb4c5" font-size="13">Optional · disabled by default</text>
    <path d="M600 254V281" stroke="#70c8b6" stroke-width="2"/>
    <g fill="#132c30" stroke="#326660">
      <rect x="44" y="281" width="266" height="170" rx="12"/>
      <rect x="326" y="281" width="266" height="170" rx="12"/>
      <rect x="608" y="281" width="266" height="170" rx="12"/>
      <rect x="890" y="281" width="266" height="170" rx="12"/>
    </g>
    <g fill="#91e0c9" font-size="20" font-weight="700">
      <text x="66" y="319">Runtime</text><text x="348" y="319">Storage + logs</text><text x="630" y="319">Connectivity</text><text x="912" y="319">Hardware</text>
    </g>
    <g fill="#d2e2e4" font-size="15">
      <text x="66" y="352">Managed task records</text><text x="66" y="378">Scheduler + timers</text><text x="66" y="404">Queues + event groups</text>
      <text x="348" y="352">SPIFFS file helpers</text><text x="348" y="378">NVS environment store</text><text x="348" y="404">Recent logs + file sink</text>
      <text x="630" y="352">Wi-Fi · ping · HTTP</text><text x="630" y="378">MQTT messaging</text><text x="630" y="404">OTA APIs*</text>
      <text x="912" y="352">GPIO · ADC · PWM</text><text x="912" y="378">I²C · SPI · UART</text><text x="912" y="404">Driver wrappers</text>
    </g>
    <path d="M600 451V478" stroke="#70c8b6" stroke-width="2"/>
    <rect x="44" y="478" width="1112" height="74" rx="12" fill="#172a3c" stroke="#355069"/>
    <text x="66" y="510" fill="#eef2ef" font-size="22" font-weight="700">ESP-IDF + FreeRTOS</text>
    <text x="66" y="533" fill="#9eb4c5" font-size="14">Task scheduling · peripheral APIs · lwIP · Wi-Fi stack · NVS · flash partitions</text>
    <rect x="44" y="568" width="1112" height="49" rx="12" fill="#22323f"/>
    <text x="600" y="599" text-anchor="middle" fill="#edf3f2" font-size="18" font-weight="700">ESP32 / ESP32-S3 / ESP32-C3</text>
    <text x="44" y="647" fill="#9eb4c5" font-size="13">* OTA requires an appropriate partition layout; the default uses a single factory application.</text>
    <text x="44" y="670" fill="#9eb4c5" font-size="13">Responsibility groups, not strict dependency layers. Tasks share the firmware address space.</text>
  </g>
</svg>
