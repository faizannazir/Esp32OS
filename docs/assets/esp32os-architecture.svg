<text x="600" y="55" text-anchor="middle" fill="#102b3d" font-family="Arial,sans-serif" font-size="28" font-weight="700">ESP32OS SOFTWARE STACK</text>
<text x="600" y="84" text-anchor="middle" fill="#587184" font-family="Arial,sans-serif" font-size="15">A modular operating environment built on ESP-IDF and FreeRTOS</text>
