<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
<title id="title">ESP32OS dashboard settings preview</title><desc id="desc">Illustrative preferences dialog showing theme, accent, density, refresh interval, title and panel visibility options.</desc>
