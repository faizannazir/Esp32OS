<text x="70" y="82" fill="#e6edf7" font-family="Arial" font-size="22" font-weight="bold">ESP32OS / Console</text><text x="70" y="110" fill="#8da1b9" font-family="Arial" font-size="13">Device overview · Browser preferences</text>
<rect x="230" y="145" width="740" height="540" rx="20" fill="#15243a" stroke="#344961" stroke-width="2"/>
<text x="270" y="194" fill="#e6edf7" font-family="Arial" font-size="23" font-weight="bold">Dashboard preferences</text><text x="270" y="221" fill="#8da1b9" font-family="Arial" font-size="13">Personalize this browser view</text>
<rect x="900" y="166" width="34" height="34" rx="9" fill="#20334c"/><text x="917" y="189" text-anchor="middle" fill="#e6edf7" font-family="Arial" font-size="18">×</text>
