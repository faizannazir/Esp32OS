<text x="270" y="504" fill="#e6edf7" font-family="Arial" font-size="15" font-weight="bold">Visible dashboard panels</text>
<rect x="270" y="527" width="17" height="17" rx="4" fill="#15584f" stroke="#63d5c2"/><text x="296" y="540" fill="#dce6f2" font-family="Arial" font-size="13">Metric cards</text><path d="M274 535l4 4 7 -9" fill="none" stroke="#e6edf7" stroke-width="2"/><rect x="600" y="527" width="17" height="17" rx="4" fill="#15584f" stroke="#63d5c2"/><text x="626" y="540" fill="#dce6f2" font-family="Arial" font-size="13">Telemetry chart</text><path d="M604 535l4 4 7 -9" fill="none" stroke="#e6edf7" stroke-width="2"/><rect x="270" y="565" width="17" height="17" rx="4" fill="#15584f" stroke="#63d5c2"/><text x="296" y="578" fill="#dce6f2" font-family="Arial" font-size="13">Process table</text><path d="M274 573l4 4 7 -9" fill="none" stroke="#e6edf7" stroke-width="2"/><rect x="600" y="565" width="17" height="17" rx="4" fill="#15584f" stroke="#63d5c2"/><text x="626" y="578" fill="#dce6f2" font-family="Arial" font-size="13">Command terminal</text><path d="M604 573l4 4 7 -9" fill="none" stroke="#e6edf7" stroke-width="2"/><rect x="270" y="603" width="17" height="17" rx="4" fill="#0b1220" stroke="#52647b"/><text x="296" y="616" fill="#dce6f2" font-family="Arial" font-size="13">Device controls</text>
