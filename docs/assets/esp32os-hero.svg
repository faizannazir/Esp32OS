<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="title desc">
  <title id="title">ESP32OS — your board, your command</title>
  <desc id="desc">A technical overview of ESP32OS: a UART shell and optional browser interface connect to embedded services, built on ESP-IDF and FreeRTOS. This is a conceptual diagram, not a hardware photograph.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101e2e"/><stop offset="1" stop-color="#07121e"/></linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#294052" stroke-opacity=".3"/></pattern>
  </defs>
  <rect width="1200" height="440" rx="22" fill="url(#bg)"/>
  <rect x="600" width="600" height="440" fill="url(#grid)"/>
  <path d="M0 1H1200" stroke="#5ad9bd" stroke-width="3"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="48" y="43" width="146" height="28" rx="14" fill="#173d3c"/>
    <circle cx="64" cy="57" r="4" fill="#75e0c6"/>
    <text x="77" y="62" font-size="12" font-weight="700" letter-spacing="1.6" fill="#9be6d5">ESP32OS</text>
    <text x="48" y="145" fill="#f3f5ef" font-size="58" font-weight="700" letter-spacing="-2">Your board,</text>
    <text x="48" y="210" fill="#79e2c7" font-size="58" font-weight="700" letter-spacing="-2">your command.</text>
    <text x="51" y="256" fill="#b7c8d1" font-size="20">An embedded operating environment</text>
    <text x="51" y="285" fill="#b7c8d1" font-size="20">built on ESP-IDF and FreeRTOS.</text>
    <path d="M50 320H548" stroke="#2a3c4e"/>
    <text x="51" y="352" fill="#e3e9e7" font-size="14" font-weight="700">UART SHELL</text>
    <text x="188" y="352" fill="#506879" font-size="14">/</text>
    <text x="212" y="352" fill="#e3e9e7" font-size="14" font-weight="700">DEVICE SERVICES</text>
    <text x="385" y="352" fill="#506879" font-size="14">/</text>
    <text x="409" y="352" fill="#e3e9e7" font-size="14" font-weight="700">WEB CONSOLE</text>
    <text x="51" y="393" fill="#8ea6b7" font-size="13">ESP32 · ESP32-S3 · ESP32-C3</text>
    <path d="M660 161V128H706M1080 161V128H1034M660 283V320H706M1080 283V320H1034" fill="none" stroke="#3b746c" stroke-width="2"/>
    <g fill="#79e2c7"><circle cx="660" cy="161" r="4"/><circle cx="1080" cy="161" r="4"/><circle cx="660" cy="283" r="4"/><circle cx="1080" cy="283" r="4"/></g>
    <rect x="706" y="70" width="328" height="92" rx="13" fill="#132738" stroke="#365469"/>
    <text x="730" y="99" fill="#88a5b7" font-size="11" letter-spacing="1.7">01 / INTERFACES</text>
    <text x="730" y="128" fill="#edf3f2" font-size="20" font-weight="700">Shell + browser dashboard</text>
    <path d="M870 162V183" stroke="#79e2c7" stroke-width="2"/>
    <rect x="706" y="183" width="328" height="92" rx="13" fill="#153936" stroke="#5aa591"/>
    <text x="730" y="212" fill="#9fddca" font-size="11" letter-spacing="1.7">02 / ESP32OS SERVICES</text>
    <text x="730" y="241" fill="#edf3f2" font-size="20" font-weight="700">Tasks · files · network · I/O</text>
    <path d="M870 275V296" stroke="#79e2c7" stroke-width="2"/>
    <rect x="706" y="296" width="328" height="72" rx="13" fill="#132738" stroke="#365469"/>
    <text x="730" y="325" fill="#88a5b7" font-size="11" letter-spacing="1.7">03 / FOUNDATION</text>
    <text x="730" y="349" fill="#edf3f2" font-size="18" font-weight="700">ESP-IDF + FreeRTOS</text>
    <text x="870" y="398" text-anchor="middle" fill="#8ea6b7" font-size="12">Remote interfaces are opt-in.</text>
  </g>
</svg>
